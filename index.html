<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pop-up Atlas: Troll Edition</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #efd9bd; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      output { position: fixed; top: 8px; left: 8px; padding: 4px 8px; color: white;
        background: #231a2bcc; font: 12px monospace; pointer-events: none; }
      .guide { position: fixed; left: 16px; bottom: 16px; max-width: calc(100vw - 32px); box-sizing: border-box;
        padding: 10px 14px; border-radius: 12px; background: #2a1d3bb8; color: #fff8ec;
        font: 13px/1.5 ui-rounded, system-ui, sans-serif; pointer-events: none; transition: opacity .3s; }
      .guide dl { display: grid; grid-template-columns: auto auto; gap: 2px 12px; margin: 0; }
      .guide dt { color: #f4a6c8; } .guide dd { margin: 0; }
      .guide kbd { display: inline-block; min-width: 1.1em; padding: 0 4px; margin-right: 2px; text-align: center;
        border: 1px solid #fff8ec80; border-radius: 4px; font: inherit; font-size: 11px; color: #fff8ec; }
      .guide button { display: none; pointer-events: auto; cursor: pointer; border: 0; padding: 0;
        background: none; color: inherit; font: inherit; }
      .guide.collapsed { padding: 4px 10px; opacity: .75; }
      .guide.collapsed dl { display: none; } .guide.collapsed button { display: block; }
    </style>
  </head>
  <body>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
